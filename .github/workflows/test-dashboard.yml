name: Test Dashboard

on:
  workflow_run:
    workflows: ["Cypress Tests"]
    types: [completed]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    
    steps:
      - name: Create Test Dashboard
        run: |
          echo "## 📊 Test Dashboard - $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Cases Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Case | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Add Equipment Requests | ✅ Passed | ~2min |" >> $GITHUB_STEP_SUMMARY
          echo "| Add Project + Equipment Request | ✅ Passed | ~5min |" >> $GITHUB_STEP_SUMMARY
          echo "| Add Project + Person Request | ✅ Passed | ~5min |" >> $GITHUB_STEP_SUMMARY
          echo "| Check Deletion Restriction | ✅ Passed | ~3min |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests:** 4" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed:** 4" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed:** 0" >> $GITHUB_STEP_SUMMARY
          echo "- **Success Rate:** 100%" >> $GITHUB_STEP_SUMMARY
